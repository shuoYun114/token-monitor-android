name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: "Token Monitor Android v1.1.1 (白主题底色与对比度全面修复版)"
          body: |
            ✨ **Token Monitor Android v1.1.1 修复版本发布！**

            本次版本重点全面修复浅色白主题（Light Amber）下的视觉缺陷与对比度问题：
            1. **彻底消除底色黑块补丁**：
               - 修复顶部设备选择器卡扣（Horizon Perspective）未选中时突兀深黑底色问题，改为柔和微晶浅灰白；
               - 修复次级 Bento 左翼“本月累计”中“共 X 款活跃工具”胶囊深黑底色问题；
               - 修复“活跃工具控制台”右上角“已就绪 X 款”胶囊深黑底色问题；
               - 修复 AI 额度全景舱与提供商列表中的能量槽底轨深黑问题。
            2. **彻底解决白底白字对比度缺失**：
               - 修复次级 Bento 左翼“本月累计”金额大数字在白色卡片上隐形的问题，自适应为高对比度深石墨灰；
               - 修复 Hero 视窗中的“Tokens”单位、精确数值与折合成本副标题文字颜色；
               - 修复模型能量槽与活跃工具名称在浅色模式下的字色适配。
            3. **继承 v1.1.0 的全部全新特性**：
               - 日/月/年周期 Token 账单与每日用量流水明细；
               - GitHub 风格贡献热力图 (Activity Heatmap)；
               - 黑主题（冰蓝）与白主题（暖黄）自由切换；
               - 永久正式 keystore 签名，支持直接覆盖升级！

            **下载方式**：直接在下方 Assets 点击下载 `app-release.apk` 安装即可。
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
