name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.7
          name: "Token Monitor Android v1.1.7 (支持手机端直接修改 AI Passport 副屏个人信息)"
          body: |
            📟 **Token Monitor Android v1.1.7 发布！支持手机端直接修改 AI Passport 硬件副屏个人信息与工牌档案！**

            1. **副屏工牌个人信息实时修改与 Flash 持久化 (Hardware Profile Editor)**：
               - 手机 App 连上开发板后，可自由修改「极客昵称 (Name)」与「通行证账号/邮箱 (Owner)」；
               - 点击「保存并下发至副屏工牌」后，数据通过 BLE 秒级写入开发板并调用 ESP32 NVS 闪存接口永久持久化；
               - 副屏个人智能主页卡片即刻刷新，断电、关机重启后依然永久保留；
               - 手机本地自动持久化记忆上次输入的个人档案。
            2. **随身硬件 BLE 中继 (Hardware BLE Relay)**：
               - 出门随身携带开发板场景，手机端 App 成为移动数据中继桥梁；
               - 自动授时校对时钟与全自动 64 字节安全分片流式推送。
            3. **官方正式 Keystore 签名**：
               - 支持从历史版本免卸载直接平滑覆盖安装升级！

            **下载方式**：直接在下方 Assets 点击下载 `app-release.apk` 安装即可。
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
