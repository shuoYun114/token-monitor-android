name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "Token Monitor Android v1.0.7 (修复额度页数据与设备页显示错误)"
          body: "🚀 **全新维护版本 (v1.0.7) 正式发布！**\n\n- **修复「AI 额度与余额」页面数据缺失**：解决因字符串插值丢失导致的仅显示「% 剩余」与「后重置」问题，新增高精度本地重置倒计时（如「4小时 59分 后重置」、「6天 6小时 后重置」）与剩余百分比实时展示\n- **修复「已接入设备」页面显示错误**：彻底修复平台与客户端版本展示（如「Windows 11 · v0.53.0」），花费支持人民币 (¥) 与美元 (\$) 实时汇率换算，正确格式化今日 Token 数量（如 1.8M）与活跃工具数\n- **修复 Android 桌面小组件数据同步**：修复 AppWidget 桌面插件的金额、Token 格式与配额百分比展示\n- **永久正式签名**：直接点击覆盖安装更新，无须卸载旧版本！\n\n**下载方式**：直接在下方 Assets 点击下载 `app-release.apk` 安装即可。"
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
