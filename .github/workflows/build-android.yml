name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: "Token Monitor Android v1.1.2 (全息算力天体视窗与航天精密机械 UI 重构版)"
          body: |
            🚀 **Token Monitor Android v1.1.2 重磅视觉重构发布！**

            本次版本全面贯彻 `/frontend-design` 设计大师法则，彻底打破传统平庸模板，确立【航天遥测精密仪器 + 瑞士复杂机械腕表】双重物理微雕美学：
            1. **核心灵魂视觉记忆点：全息算力天体视窗 (Chrono-Telemetry Aperture)**：
               - 外环嵌合 60 单元激光精密微雕刻度，5 单元主副分度；
               - 内环搭载物理阻尼陀飞轮自转双轨能量流光环；
               - 巨幕等宽数值排版与嵌套式折合成本金属胶囊；
               - 底部工业 LED 点阵状态遥测条（带微光阻尼呼吸）。
            2. **航天机舱结构面板与微雕点缀 (Aerospace Telemetry Panels)**：
               - Bento Grid 次级情报舱（左翼月度支出、右翼额度雷达）注入机舱四角紧固螺栓与 `TELEMETRY // L-01` 工业微刻标牌；
               - 活跃工具列表升级为航天机架精密芯片插槽，加入专属流光指示色条；
               - GitHub 贡献热力图、大数字审计看板、多设备集群全面融入工业仪表感。
            3. **极致双色调校 (Obsidian / Ivory Crystal)**：
               - 深色模式：黑曜岩与航天钛灰底座 + 冷冰极蓝发光管；
               - 浅色模式：象牙暖白拉丝微晶 + 琥珀日光金刻度；
               - 100% 消除任何色块补丁与对比度缺失。
            4. **官方正式 keystore 签名**：
               - 支持从 v1.1.0 / v1.1.1 直接免卸载平滑覆盖升级！

            **下载方式**：直接在下方 Assets 点击下载 `app-release.apk` 安装即可。
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
