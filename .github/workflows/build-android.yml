name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.6
          name: "Token Monitor Android v1.1.6 (新增 AI Passport 随身硬件副屏 BLE 中继)"
          body: |
            📟 **Token Monitor Android v1.1.6 发布！新增 AI Passport 随身极客副屏 BLE 蓝牙中继支持！**

            1. **AI Passport 随身硬件副屏 BLE 蓝牙中继 (Hardware BLE Relay)**：
               - 针对出门随身携带开发板场景，手机端 App 成为移动数据中继桥梁；
               - 深度对接 Nordic UART Service (NUS) 串口透传协议与 ESP32-C3 固件；
               - 首次建立连接自动对齐网络授时与当前时区 (`{"time": [ts, offset]}`)；
               - 手机端流式或轮询获取到最新 Token 消耗、费用与主力模型额度时，全自动分片推送到副屏；
               - 包含高可靠 64 字节 Chunking 与安全延迟机制，杜绝数据丢包。
            2. **极客遥测控制卡片 (Hardware Relay Card)**：
               - 设置页面与首页 AppBar 增加微晶玻璃控制卡片与状态呼吸指示；
               - 支持一键自动扫描、直连、手动强制下发测试与断开管理。
            3. **官方正式 Keystore 签名**：
               - 支持从历史版本免卸载直接平滑覆盖安装升级！

            **下载方式**：直接在下方 Assets 点击下载 `app-release.apk` 安装即可。
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
