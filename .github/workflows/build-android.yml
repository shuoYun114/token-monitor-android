name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: "Token Monitor Android v1.0.9 (暖色调白与暖黄色高级审美版)"
          body: |
            ✨ **Token Monitor Android v1.0.9 正式发布！**

            本次更新深度融入了**暖色调白色 (Ivory Warm White)** 与**暖黄色 (Amber Warm Yellow)** 奢华科技色彩系统，全面提升视觉温润感与算力价值感：
            1. **暖色调白色系 (Warm White)**：引入象牙暖白 (`#FAF8F5`) 与高光纯暖白 (`#FFFDF8`)，替换刺眼冷白，应用于关键标题、大数字伴随单位与微晶玻璃导光受光线，大幅减轻视觉疲劳，尽显典雅；
            2. **太阳暖黄色系 (Warm Yellow)**：引入明艳温润暖黄 (`#FBBF24`) 与弥散微光晕，重构「实时折合成本」卡槽、月度支出核心数值与工具消耗金额，赋予核心资产与成本概念天然的财富光环；
            3. **冷暖对撞 (Warm-Cool Interlock)**：顶部 2:1 Bento 主视窗中「冷青算力流」与「暖黄价值成本」形成极具张力的冷暖交融；次级 Bento 双翼「左翼暖黄月度支出」与「右翼翡翠健康雷达」完美均衡；
            4. **微晶导光线升级**：`GlassContainer` 支持物理微晶受光面暖白色与暖黄色导光反射；
            5. **模型分段能量带**：增加极速/轻量模型专属暖黄色段，能量占比层次更鲜明；
            6. **永久正式签名保证**：支持直接点击覆盖安装更新，无须卸载旧版本！

            **下载方式**：直接在下方 Assets 点击下载 `app-release.apk` 安装即可。
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
