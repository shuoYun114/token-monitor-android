name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "Token Monitor Android v1.0.5 (汇率精确对齐版)"
          body: "💱 **汇率精确对齐版 (v1.0.5)** 发布！\n\n- 集成 CurrencyService 动态汇率服务，与桌面端官方汇率源（6.7203 CNY/USD）保持 100% 同步，人民币金额显示完全一致！\n- 设置页支持查看汇率与一键刷新最新汇率。\n- 固化正式签名，支持直接覆盖安装升级。\n\n**下载方式**：直接点击下方 Assets 中的 `app-release.apk` 即可下载安装。"
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
