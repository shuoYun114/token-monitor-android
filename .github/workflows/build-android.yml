name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.5
          name: "Token Monitor Android v1.1.5 (AI 消费小票一键截图存相册 + 真实热敏撕纸)"
          body: |
            📸 **Token Monitor Android v1.1.5 发布！新增消费小票一键截图并保存系统相册！**

            1. **小票高保真截图与相册直存 (Receipt Snapshot & Gallery Export)**：
               - 小票顶部操作栏新增「📸 截图存相册」按钮；
               - 采用 3.0x 超采样像素比，将热敏纸、ASCII Logo、输入输出细分数据与毒舌吐槽完美渲染为高清位图；
               - 原生对接 Android `MediaStore`，图片直接存入手机系统相册（`Pictures/TokenMonitor`），系统相册即时可见；
               - 保存后唤起交互式全景大图预览弹窗，支持双指自由缩放与拖拽查看细节。
            2. **真实收银机热敏撕纸视觉 (Realistic Jagged Thermal Paper)**：
               - 上下撕纸锯齿齿槽真正镂空透明，导出图片带完整物理撕裂感；
               - 分享至微信好友、朋友圈或社交媒体宛如真实打印票据。
            3. **模型输入/输出与缓存命中遥测 (Breakdown Telemetry)**：
               - 完整支持展开模型手风琴查看缓存命中/未命中、输出 Tokens 与未分类 Tokens。
            4. **官方正式 keystore 签名**：
               - 支持从历史版本免卸载直接平滑覆盖安装升级！

            **下载方式**：直接在下方 Assets 点击下载 `app-release.apk` 安装即可。
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
