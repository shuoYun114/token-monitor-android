name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Token Monitor Android v1.0.3"
          body: "🚀 最新版本 Android APK (v1.0.3) 发布！\n\n- 在主看板顶部新增「今日消耗 Token」专属大字栏目（包含 M 级与精确数量展示）\n- 优化 RadialGauge 环形额度仪表盘数字与倒计时居中展示\n- 修复活跃工具卡片金额显示与排版布局\n\n**下载方式**：直接点击下方 Assets 中的 `app-release.apk` 即可下载安装。"
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
