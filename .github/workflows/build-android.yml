name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.3
          name: "Token Monitor Android v1.1.3 (AI Token 消费小票与毒舌神吐槽功能版)"
          body: |
            🧾 **Token Monitor Android v1.1.3 新特性发布！**

            本次版本参考开源项目 [Hchen1218/token-receipt](https://github.com/Hchen1218/token-receipt)，正式推出**「AI Token 消费小票与神吐槽 (Token Receipt with Punchline)」**功能：
            1. **仿真热敏纸小票美学 (Thermal Receipt Aesthetic)**：
               - 温润米白热敏纸质感底色，上下边缘带收银机锯齿撕纸效果；
               - 经典 ASCII 像素 Logo（支持 Claude Code / Cursor / Token Monitor 专属艺术头图）；
               - 收银台编号、结账时间、设备名称、模型与工具明细清单（Token 数量与折合金额）；
               - 真实比例 ASCII 条形码与 Receipt 防伪编号。
            2. **灵魂核心：毒舌/幽默神吐槽 (Receipt Punchlines)**：
               - 内置精选分类神吐槽（涵盖改版迭代、视觉设计、Bug 调试、深度思考与掏空钱包）；
               - “画面稳了，预算死了。”、“最后一版这个词，本来就不诚实。”、“Bug 修完了，费用继承了。”、“推理不免费，犹豫更贵。”；
               - 支持“🎲 换一句”趣味交互，越看越上头！
            3. **中英双语与一键复制分享**：
               - 支持 `EN / 中文` 即时切换小票文案与吐槽；
               - 一键复制纯文本 ASCII 小票，可直接粘贴分享至微信、即刻、朋友圈或 Discord；
               - 首页与账单流水随时一键打出今日或任意历史日期的消费小票。
            4. **官方正式 keystore 签名**：
               - 支持从历史版本直接免卸载平滑覆盖升级！

            **下载方式**：直接在下方 Assets 点击下载 `app-release.apk` 安装即可。
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
