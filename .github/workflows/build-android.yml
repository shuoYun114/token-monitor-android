name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "Token Monitor Android v1.0.8 (西瓜同学8大高级审美Dashboard全新重构版)"
          body: |
            🎨 **全新顶级审美大版本 (v1.0.8) 正式发布！**

            本版本深度融入抖音博主 **西瓜同学🍉**（开源设计项目 `finesse`）提出的 **8 种高级审美 Dashboard 设计法则**：
            1. **Bento Grid（非对称便当盒架构）**：顶部 2:1 权重 Hero 主视窗打造「实时算力与成本流动枢纽」，超粗 32px 等宽算力青流 + 实时折合花费卡槽交融互锁；双列次级情报窗集成「本月累计支出」与「AI 额度健康雷达」；
            2. **Dark Cyber Console（黑曜石控制台底色与克制色彩）**：底色升级为黑曜石深黑 `#080A10`，严格限定青蓝算力、翡翠健康、琥珀成本与旗舰紫四大能量色阶；
            3. **Dual-tone Glow（双层导光微晶毛玻璃）**：卡片顶边带有 1px 细微物理受光导光高光线与柔和环境弥散光晕 (`Ambient Glow`)；
            4. **Typographic Rhythm（科技等宽字阶反差）**：超粗等宽大数字 + 11px 基线对齐弱化单位；
            5. **Energy Viz（全景分段能量带与光弧能量舱）**：新增贯穿式多模型全景分段能量带 (`Segmented Energy Strip`)，额度雷达升级为带端点光珠的高清光弧能量舱；
            6. **Pulse Status（微状态呼吸胶囊）**：Hub 连接状态与设备在线状态均升级为脉冲发光光圈微胶囊；
            7. **Horizon Perspective（多维硬件透视卡扣）**：设备切换条升级为芯片卡扣风格，选中具备青蓝微晶外发光；
            8. **Micro-Polish（触觉与微微动效）**：优化插槽式卡片按压反馈与圆角边框渐变；
            9. **永久正式签名保证**：直接点击覆盖安装更新，无须卸载旧版本！

            **下载方式**：直接在下方 Assets 点击下载 `app-release.apk` 安装即可。
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
