name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Token Monitor Android v1.0.4 (固化永久签名版)"
          body: "🔐 **固化永久签名版 (v1.0.4)** 发布！\n\n- 固化 Android 官方正式 Release 签名密钥库 (`release.keystore`)，彻底终结云端每次编译随机生成 debug 签名导致的「签名不一致无法更新」Bug。\n- 从本次 v1.0.4 开始，后续所有更新均支持**直接点击覆盖更新安装**，再也无需先卸载旧版本！\n\n**下载方式**：直接点击下方 Assets 中的 `app-release.apk` 即可下载安装。"
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
