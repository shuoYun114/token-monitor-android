name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Token Monitor Android v1.1.0 (Token账单流水 + GitHub贡献热力图 + 黑白双主题版)"
          body: |
            ✨ **Token Monitor Android v1.1.0 重磅发布！**

            本次版本带来重大的核心功能升级与全新双主题视觉体验：
            1. **Token 周期账单与每日流水**：新增全功能「账单」大屏，支持切换查看「日账单」、「月度账单」、「年度与全时期总览」，详细展示每天消耗的 Token 流水、模型消耗明细与活跃工具分布；
            2. **GitHub 风格贡献热力图 (Activity Heatmap)**：7 行按周对齐的活跃网格，真实反映每日 Token 消耗强度（0-4 级色阶），支持水平平滑滑动浏览近 20 周轨迹，并支持点击任意方块下钻查看当日账单详情；
            3. **黑白双主题自由切换**：
               - **黑主题 (Dark Console)**：黑曜石深黑底 + 纯净白主字 + 冰蓝高光 (`#38BDF8`)；
               - **白主题 (Light Amber)**：纯净暖白底 + 深石墨灰字 + 暖黄高光 (`#F59E0B` / `#FBBF24`)；
               - 在【设置】中一键切换，全局即时生效并本地持久化存储；
            4. **组件毛玻璃与全屏自适应**：`GlassContainer`、各种看板卡片与状态指示器全面自适应浅色与深色模式，兼顾冷艳科技感与温润品质感；
            5. **历史用量持久化与离线容灾**：支持 `/api/history` 滚动数据与本地 SharedPreferences 缓存，断网或 Hub 离线时平滑展示；
            6. **永久正式签名保证**：支持直接下载 `app-release.apk` 覆盖安装升级，免卸载保留所有配置！

            **下载方式**：直接在下方 Assets 点击下载 `app-release.apk` 安装即可。
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
