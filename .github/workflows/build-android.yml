name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "Token Monitor Android v1.0.6 (对齐电脑端 v0.53.0 最新规范)"
          body: "🚀 **全新版本 (v1.0.6) 正式发布！**\n\n- 深度对齐电脑端 GitHub 最新版 (v0.53.0) 核心规范与数据协议\n- **新增「今日活跃模型分布与排行 (Models Breakdown)」**：直观查看各 AI 模型（Gemini 3.7 / Claude 3.7 / GPT / DeepSeek 等）用量、占比与花费\n- **升级「AI 额度健康度」**：完整支持 Antigravity 等 Provider 的多额度窗口（Gemini 85% 与 Claude/GPT 100% 并列大仪表盘）\n- **扩充最新工具与提供商支持**：新增阿里巴巴通义千问 (Alibaba/Qwen Token Plan)、Zed Editor、Unsloth Studio、Trae 等新工具识别\n- **多设备模型聚合优化**：跨设备统计时模型分布完全无缝汇总\n- **永久固化正式签名**：直接点击覆盖安装更新，无缝升级！\n\n**下载方式**：直接点击下方 Assets 中的 `app-release.apk` 即可极速安装。"
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
