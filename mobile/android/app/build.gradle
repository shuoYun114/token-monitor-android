plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.javis.tokenmonitor"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.javis.tokenmonitor"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "1.0.6"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "tokenmonitor2026"
            keyAlias "tokenmonitor"
            keyPassword "tokenmonitor2026"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}