name: token_monitor_mobile
description: Android mobile client and home screen widget for Token Monitor.
publish_to: 'none'
version: 1.2.0+19


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  home_widget: ^0.6.0
  mobile_scanner: ^5.1.1
  intl: ^0.19.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8
  flutter_blue_plus: 1.32.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
